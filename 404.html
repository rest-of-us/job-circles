       relative links at the site root: /<repo>/ on a github.io project site,
       / anywhere else (a custom domain or self-hosted copy). -->
  <script>
    (function () {
      var parts = location.pathname.split('/');
      var base = /\.github\.io$/.test(location.hostname) && parts.length > 2 ? '/' + parts[1] + '/' : '/';

      el.href = base;
      document.head.appendChild(el);
    })();
  </script>
