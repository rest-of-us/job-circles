name: Validate submissions

on:
  pull_request:
    paths:
      - 'profiles/community/**'
      - 'profiles/us/**'
      - 'profiles/africa/**'
      - 'profiles/middle-east/**'
      - 'circles/entries/**'
      - 'hubs.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Run the validators and schemas from the base branch, not from the PR,
      # so a PR can't loosen the rules it is checked against.
      - name: Prepare trusted validators
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/trusted"
          git archive "$BASE_SHA" scripts profiles/schema.json circles/schema.json hubs.schema.json | tar -x -C "$RUNNER_TEMP/trusted"
          cd "$RUNNER_TEMP/trusted" && npm install --no-save --no-package-lock ajv@8 ajv-formats@3

      - name: Check profile changes
        # Community takes any region; each regional folder only takes its own.
        run: |
          status=0
          node "$RUNNER_TEMP/trusted/scripts/validate-profiles.mjs" profiles/community || status=1
          for hub in us africa middle-east; do
            node "$RUNNER_TEMP/trusted/scripts/validate-profiles.mjs" "profiles/$hub" "$hub" || status=1
          done
          exit $status
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}

      - name: Check circle changes
        if: success() || failure()
        run: node "$RUNNER_TEMP/trusted/scripts/validate-circles.mjs" circles/entries
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}

      - name: Check hub registry
        if: success() || failure()
        run: node "$RUNNER_TEMP/trusted/scripts/validate-registry.mjs" hubs.json
